services:
  - type: web
    name: windscope-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: WINDFOR_ARCHIVE_PATH
        value: /var/data/windfor.sqlite3
      - key: ELEXON_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
      - key: EVALUATION_START
        value: "2026-01-01"
      - key: EVALUATION_END
        value: "2026-01-31"
      - key: DEFAULT_DECISION_HOUR_UTC
        value: "9"
      - key: CACHE_TTL_SECONDS
        value: "900"
      - key: ELEXON_TIMEOUT_SECONDS
        value: "30"
      - key: ELEXON_MAX_RETRIES
        value: "3"
    disk:
      name: windscope-data
      mountPath: /var/data
      sizeGB: 1
